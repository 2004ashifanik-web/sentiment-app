<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333333;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            resize: none;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        textarea:focus {
            border-color: #4CAF50;
        }
        button {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #45a049;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background-color: #eef7ee;
            border: 1px solid #c3e6cb;
            text-align: center;
        }
        .result-title {
            font-weight: bold;
            color: #155724;
            font-size: 18px;
        }
        .confidence {
            color: #555555;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Sentiment Analysis</h2>
    
    <!-- Action /api/predict এবং method post সঠিকভাবে যুক্ত করা আছে -->
    <form action="/api/predict" method="post">
        <textarea name="text" placeholder="Enter text to analyze sentiment..." required>{{ text }}</textarea>
        <button type="submit">Predict Sentiment</button>
    </form>

    {% if sentiment %}
    <div class="result-box">
        <div class="result-title">Sentiment: {{ sentiment }}</div>
        {% if confidence %}
            <div class="confidence">Confidence: {{ confidence }}%</div>
        {% endif %}
    </div>
    {% endif %}
</div>

</body>
</html>
