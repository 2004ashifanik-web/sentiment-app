<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Intelligence Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .soft-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-6">

    <div class="max-w-2xl w-full soft-card rounded-3xl p-6 md:p-8 shadow-2xl">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-3xl md:text-4xl font-extrabold text-sky-400 tracking-tight">
                Sentiment Analyzer
            </h1>
            <p class="text-slate-400 text-xs md:text-sm mt-1">আপনার রিভিউ বা কমেন্টের অনুভূতি বিশ্লেষণ করুন</p>
        </div>

        <!-- Input Section -->
        <div class="space-y-4">
            <div>
                <textarea id="inputText" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition text-sm md:text-base resize-none" placeholder="এখানে আপনার মন্তব্য বা রিভিউ লিখুন..."></textarea>
            </div>

            <button onclick="analyzeSentiment()" id="submitBtn" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3.5 rounded-2xl transition duration-200 flex justify-center items-center gap-2 shadow-lg shadow-sky-500/20 text-sm md:text-base">
                <i class="fa-solid fa-wand-magic-sparkles text-sm"></i> 
                <span>Analyze Sentiment</span>
            </button>
        </div>

        <!-- Result Card -->
        <div id="resultCard" class="hidden mt-6 p-6 rounded-2xl bg-slate-900 border border-slate-800 shadow-xl transition-all duration-300">
            <div class="flex justify-between items-center mb-4">
                <span id="sentimentBadge" class="px-4 py-1.5 rounded-xl text-xs md:text-sm font-bold flex items-center gap-2"></span>
                <span id="confidenceVal" class="text-slate-200 font-extrabold text-base md:text-lg">0.0%</span>
            </div>

            <!-- Main Progress Bar -->
            <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden mb-6">
                <div id="progressBar" class="h-full rounded-full transition-all duration-700 ease-out" style="width: 0%"></div>
            </div>

            <!-- Sentiment Distribution Graph Bar -->
            <div class="pt-4 border-t border-slate-800">
                <p class="text-xs font-bold text-sky-400 uppercase tracking-wider mb-2"><i class="fa-solid fa-chart-simple me-1"></i> Sentiment Distribution Graph</p>
                <div class="flex h-4 rounded-xl overflow-hidden bg-slate-800 p-0.5 border border-slate-700">
                    <div id="posBar" class="bg-emerald-500 h-full transition-all duration-500" style="width: 33%" title="Positive"></div>
                    <div id="neuBar" class="bg-amber-400 h-full transition-all duration-500" style="width: 33%" title="Neutral"></div>
                    <div id="negBar" class="bg-rose-500 h-full transition-all duration-500" style="width: 34%" title="Negative"></div>
                </div>
                <div class="flex justify-between text-[11px] font-semibold text-slate-400 mt-2">
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Positive</span>
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-400 inline-block"></span> Neutral</span>
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-rose-500 inline-block"></span> Negative</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function analyzeSentiment() {
            const input = document.getElementById('inputText').value;
            const btn = document.getElementById('submitBtn');
            const resultCard = document.getElementById('resultCard');
            const badge = document.getElementById('sentimentBadge');
            const confVal = document.getElementById('confidenceVal');
            const bar = document.getElementById('progressBar');

            const posBar = document.getElementById('posBar');
            const neuBar = document.getElementById('neuBar');
            const negBar = document.getElementById('negBar');

            if (!input.trim()) {
                alert("অনুগ্রহ করে একটি কমেন্ট লিখুন।");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Analyzing...`;

            try {
                const res = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: input })
                });

                const data = await res.json();

                resultCard.classList.remove('hidden');
                confVal.innerText = `Confidence: ${data.confidence}`;
                bar.style.width = data.confidence;

                const sentiment = data.sentiment.toLowerCase();
                const score = parseFloat(data.confidence);

                if (sentiment === 'positive') {
                    badge.className = "px-4 py-1.5 rounded-xl text-xs md:text-sm font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                    badge.innerHTML = `<i class="fa-solid fa-face-smile"></i> Positive`;
                    bar.className = "h-full bg-emerald-500 transition-all duration-700";

                    posBar.style.width = `${score}%`;
                    neuBar.style.width = `${(100 - score) / 2}%`;
                    negBar.style.width = `${(100 - score) / 2}%`;

                } else if (sentiment === 'negative') {
                    badge.className = "px-4 py-1.5 rounded-xl text-xs md:text-sm font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30";
                    badge.innerHTML = `<i class="fa-solid fa-face-frown"></i> Negative`;
                    bar.className = "h-full bg-rose-500 transition-all duration-700";

                    negBar.style.width = `${score}%`;
                    posBar.style.width = `${(100 - score) / 2}%`;
                    neuBar.style.width = `${(100 - score) / 2}%`;

                } else {
                    badge.className = "px-4 py-1.5 rounded-xl text-xs md:text-sm font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30";
                    badge.innerHTML = `<i class="fa-solid fa-face-meh"></i> Neutral`;
                    bar.className = "h-full bg-amber-400 transition-all duration-700";

                    neuBar.style.width = `${score}%`;
                    posBar.style.width = `${(100 - score) / 2}%`;
                    negBar.style.width = `${(100 - score) / 2}%`;
                }

            } catch (err) {
                alert("সার্ভারে কানেক্ট হতে সমস্যা হচ্ছে!");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles text-sm"></i> <span>Analyze Sentiment</span>`;
            }
        }
    </script>
</body>
</html>
